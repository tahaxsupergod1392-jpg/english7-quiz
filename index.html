<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>آزمون جامع Prospect 1 - مکالمه و اسپل</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: Tahoma, sans-serif;
    background: linear-gradient(160deg, #0f172a, #1e293b);
    color: #eee; min-height: 100vh; display: flex; flex-direction: column;
  }
  header {
    background: #1e3a8a; padding: 14px; text-align: center;
    box-shadow: 0 2px 10px #0008;
  }
  header h1 { margin: 0; font-size: 17px; color: #fbbf24; }
  header p { margin: 4px 0 0; font-size: 11px; color: #cbd5e1; }

  .container { padding: 16px; max-width: 500px; margin: auto; flex: 1; display: flex; flex-direction: column; justify-content: center; }

  #splash {
    position: fixed; inset: 0; background: linear-gradient(160deg, #0f172a, #1e3a8a);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 999; padding: 24px; text-align: center;
  }
  #splash.hidden { display: none; }
  #splash h2 { color: #fbbf24; font-size: 22px; margin-bottom: 8px; }
  #splash p { font-size: 13px; color: #cbd5e1; line-height: 1.9; margin-bottom: 24px; }
  #splash .big-icon { font-size: 72px; margin-bottom: 16px; }
  #splash button {
    background: linear-gradient(145deg, #22c55e, #15803d);
    color: #fff; border: none; padding: 18px 32px; border-radius: 16px;
    font-family: inherit; font-size: 17px; font-weight: bold; cursor: pointer;
    box-shadow: 0 8px 24px #22c55e66; transition: .2s; width: 100%; max-width: 320px;
  }
  #splash button:active { transform: scale(.97); }

  .card {
    background: #1e293b; border-radius: 20px; padding: 24px;
    margin-bottom: 16px; box-shadow: 0 4px 15px #0006; text-align: center;
  }

  .question-box {
    padding: 30px 10px; background: #0f172a;
    border-radius: 16px; margin-bottom: 20px; border: 1px dashed #475569;
  }
  .question-label { font-size: 12px; color: #94a3b8; margin-bottom: 10px; }
  .question-text { font-size: 22px; font-weight: bold; color: #60a5fa; min-height: 60px; line-height: 1.6; }
  .question-text.fa { color: #f472b6; direction: rtl; }

  .mic-status {
    font-size: 48px; margin: 10px 0; height: 60px;
    display: flex; align-items: center; justify-content: center;
  }
  .mic-status.listening { animation: pulse 1.2s infinite; color: #22c55e; }
  .mic-status.speaking { color: #fbbf24; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }

  .status { font-size: 14px; margin: 8px 0; min-height: 24px; color: #cbd5e1; }
  .status.ok { color: #4ade80; font-weight: bold; font-size: 16px; }
  .status.bad { color: #f87171; font-weight: bold; font-size: 16px; }

  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row > * { flex: 1; }

  button {
    background: #334155; color: #fff; border: none; padding: 14px;
    border-radius: 12px; font-family: inherit; font-size: 14px; cursor: pointer;
    transition: .2s;
  }
  button:active { transform: scale(.97); }
  button.main { background: #1d4ed8; font-weight: bold; }
  button.danger { background: #b91c1c; }

  .stats { display: flex; justify-content: space-around; text-align: center; font-size: 11px; color:#94a3b8; margin-top: 16px;}
  .stats b { display: block; font-size: 22px; color: #fbbf24; }

  .hint { font-size: 11px; color: #64748b; margin-top: 10px; line-height: 1.7; text-align: right; }
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: #16a34a; color: #fff; padding: 10px 20px; border-radius: 20px;
    font-size: 13px; z-index: 100; opacity: 0; transition: .3s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .toast.err { background: #dc2626; }
  .progress { height: 6px; background: #0f172a; border-radius: 3px; overflow: hidden; margin: 10px 0; }
  .progress > div { height: 100%; background: linear-gradient(90deg, #fbbf24, #f472b6); width: 0%; transition: .3s; }

  .result-screen { display: none; text-align: center; padding: 20px 0; }
  .result-screen h2 { color: #fbbf24; font-size: 24px; }
  .result-score { font-size: 48px; font-weight: bold; color: #4ade80; margin: 20px 0; }
  .result-details { display: flex; justify-content: space-around; margin: 20px 0; font-size: 16px; }
  .result-details div { background: #0f172a; padding: 10px 20px; border-radius: 10px; }
</style>
</head>
<body>

<div id="splash">
  <div class="big-icon">🗣️</div>
  <h2>آزمون مکالمه و اسپل Prospect 1</h2>
  <p>سوالات هوشمند: معنی، اسپل، جای خالی، مکالمه</p>
  <button onclick="requestPermissionsAndStart()">✅ شروع آزمون</button>
  <p class="hint" style="color:#94a3b8; margin-top: 16px;">
    پس از زدن دکمه، به میکروفن اجازه بدهید.
  </p>
</div>

<header>
  <h1>🗣️ آزمون هوشمند زبان هفتم</h1>
  <p>سوالات تصادفی و بدون تکرار</p>
</header>

<div class="container">
  <div id="quizContainer">
    <div class="card">
      <div class="progress"><div id="progBar"></div></div>

      <div class="question-box">
        <div class="question-label" id="qLabel">آماده‌ام...</div>
        <div class="question-text" id="questionText">...</div>
      </div>

      <div class="mic-status" id="micIcon">🔊</div>
      <div class="status" id="status">در حال آماده‌سازی...</div>

      <div class="row">
        <button class="main" id="startBtn" onclick="toggleAuto()">▶️ شروع آزمون</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button onclick="forceNext()">⏭️ رد کردن</button>
        <button class="danger" onclick="finishExam()">🏁 پایان و نتیجه</button>
      </div>

      <div class="stats">
        <div>درست <b id="statCorrect">0</b></div>
        <div>غلط <b id="statWrong">0</b></div>
        <div>امتیاز <b id="statScore">0</b></div>
      </div>
    </div>
  </div>

  <div id="resultContainer" class="card result-screen">
    <h2>🏆 نتیجه نهایی</h2>
    <div class="result-score" id="finalScore">20</div>
    <div class="result-details">
      <div>درست: <b id="resCorrect">0</b></div>
      <div>غلط: <b id="resWrong">0</b></div>
    </div>
    <button class="main" onclick="location.reload()" style="margin-top:20px">🔄 آزمون مجدد</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ---------- دیتابیس جامع با کلمات و جملات ----------
const WORDS_DB = [
  // Lesson 1
  {en:"name", fa:"نام", type:"vocab", lesson:1},
  {en:"first name", fa:"اسم کوچک", type:"vocab", lesson:1},
  {en:"last name", fa:"نام خانوادگی", type:"vocab", lesson:1},
  {en:"What is your name?", fa:"اسم تو چیست؟", type:"sentence", lesson:1},
  {en:"My name is Ali.", fa:"اسم من علی است.", type:"sentence", lesson:1},
  {en:"How do you spell your name?", fa:"چطور اسمت را هجی می‌کنی؟", type:"spelling", lesson:1},
  {en:"Hello", fa:"سلام", type:"vocab", lesson:1},
  {en:"Good morning", fa:"صبح بخیر", type:"vocab", lesson:1},
  {en:"How are you?", fa:"حالت چطوره؟", type:"sentence", lesson:1},
  {en:"Fine, thanks.", fa:"خوبم، ممنون.", type:"sentence", lesson:1},

  // Lesson 2
  {en:"boy", fa:"پسر", type:"vocab", lesson:2},
  {en:"girl", fa:"دختر", type:"vocab", lesson:2},
  {en:"friend", fa:"دوست", type:"vocab", lesson:2},
  {en:"classmate", fa:"همکلاسی", type:"vocab", lesson:2},
  {en:"Who is that boy?", fa:"آن پسر کیست؟", type:"sentence", lesson:2},
  {en:"He is my friend.", fa:"او دوست من است.", type:"sentence", lesson:2},
  {en:"Nice to meet you.", fa:"از آشنایی خوشحالم.", type:"sentence", lesson:2},
  {en:"Can you help me, please?", fa:"می‌تونی کمکم کنی؟", type:"sentence", lesson:2},

  // Lesson 3
  {en:"age", fa:"سن", type:"vocab", lesson:3},
  {en:"birthday", fa:"تولد", type:"vocab", lesson:3},
  {en:"How old are you?", fa:"چند سالت است؟", type:"sentence", lesson:3},
  {en:"I am twelve years old.", fa:"من دوازده سال دارم.", type:"sentence", lesson:3},
  {en:"When is your birthday?", fa:"تولدت کی است؟", type:"sentence", lesson:3},

  // Lesson 4
  {en:"family", fa:"خانواده", type:"vocab", lesson:4},
  {en:"father", fa:"پدر", type:"vocab", lesson:4},
  {en:"mother", fa:"مادر", type:"vocab", lesson:4},
  {en:"brother", fa:"برادر", type:"vocab", lesson:4},
  {en:"sister", fa:"خواهر", type:"vocab", lesson:4},
  {en:"job", fa:"شغل", type:"vocab", lesson:4},
  {en:"doctor", fa:"دکتر", type:"vocab", lesson:4},
  {en:"nurse", fa:"پرستار", type:"vocab", lesson:4},
  {en:"What is your father's job?", fa:"شغل پدرت چیه؟", type:"sentence", lesson:4},
  {en:"He is a mechanic.", fa:"او مکانیک است.", type:"sentence", lesson:4},
  {en:"How old is your father?", fa:"پدرت چند سالشه؟", type:"sentence", lesson:4},

  // Lesson 5
  {en:"tall", fa:"قدبلند", type:"vocab", lesson:5},
  {en:"short", fa:"کوتاه", type:"vocab", lesson:5},
  {en:"suit", fa:"کت و شلوار", type:"vocab", lesson:5},
  {en:"shirt", fa:"پیراهن", type:"vocab", lesson:5},
  {en:"shoes", fa:"کفش", type:"vocab", lesson:5},
  {en:"Who is Mr. Davari?", fa:"آقای داوری کیست؟", type:"sentence", lesson:5},
  {en:"He is the tall man.", fa:"او مرد قدبلند است.", type:"sentence", lesson:5},
  {en:"He is wearing a gray suit.", fa:"او کت و شلوار خاکستری پوشیده.", type:"sentence", lesson:5},

  // Lesson 6
  {en:"house", fa:"خانه", type:"vocab", lesson:6},
  {en:"kitchen", fa:"آشپزخانه", type:"vocab", lesson:6},
  {en:"bedroom", fa:"اتاق خواب", type:"vocab", lesson:6},
  {en:"living room", fa:"اتاق نشیمن", type:"vocab", lesson:6},
  {en:"Where are you?", fa:"کجایی؟", type:"sentence", lesson:6},
  {en:"I am in the kitchen.", fa:"من در آشپزخانه هستم.", type:"sentence", lesson:6},
  {en:"What are you doing?", fa:"داری چیکار می‌کنی؟", type:"sentence", lesson:6},
  {en:"I am cooking lunch.", fa:"دارم ناهار می‌پزم.", type:"sentence", lesson:6},

  // Lesson 7
  {en:"address", fa:"آدرس", type:"vocab", lesson:7},
  {en:"street", fa:"خیابان", type:"vocab", lesson:7},
  {en:"phone number", fa:"شماره تلفن", type:"vocab", lesson:7},
  {en:"What is your address?", fa:"آدرس شما چیه؟", type:"sentence", lesson:7},
  {en:"Where do you live?", fa:"کجا زندگی می‌کنی؟", type:"sentence", lesson:7},
  {en:"What time is it?", fa:"ساعت چنده؟", type:"sentence", lesson:7},

  // Lesson 8
  {en:"food", fa:"غذا", type:"vocab", lesson:8},
  {en:"drink", fa:"نوشیدنی", type:"vocab", lesson:8},
  {en:"bread", fa:"نان", type:"vocab", lesson:8},
  {en:"rice", fa:"برنج", type:"vocab", lesson:8},
  {en:"kebab", fa:"کباب", type:"vocab", lesson:8},
  {en:"chicken", fa:"مرغ", type:"vocab", lesson:8},
  {en:"What is your favorite food?", fa:"غذای مورد علاقه‌ات چیه؟", type:"sentence", lesson:8},
  {en:"I am hungry.", fa:"من گرسنه هستم.", type:"sentence", lesson:8},
  {en:"I am thirsty.", fa:"من تشنه هستم.", type:"sentence", lesson:8},
];

// ---------- تولید سوالات پویا (داینامیک) ----------
let allQuestions = [];

function buildQuestionBank() {
  allQuestions = [];
  
  WORDS_DB.forEach(item => {
    const word = item.en;
    const meaning = item.fa;
    const lesson = item.lesson;
    
    // 1. سوال معنی (انگلیسی به فارسی)
    if (item.type === 'vocab') {
      allQuestions.push({
        id: 'meaning_en_' + word,
        questionText: `معنی کلمه "${word}" چیست؟`,
        expectedAnswer: meaning,
        langForQuestion: 'fa-IR', // سوال را به فارسی می‌خوانیم
        langForAnswer: 'fa-IR', // جواب به فارسی است
        type: 'meaning'
      });
      
      // 2. سوال معنی (فارسی به انگلیسی)
      allQuestions.push({
        id: 'meaning_fa_' + word,
        questionText: `معنی "${meaning}" به انگلیسی چیست؟`,
        expectedAnswer: word,
        langForQuestion: 'fa-IR',
        langForAnswer: 'en-US',
        type: 'meaning'
      });
      
      // 3. سوال اسپل (هجی کردن)
      allQuestions.push({
        id: 'spell_' + word,
        questionText: `کلمه "${word}" را چطور هجی می‌کنی؟`,
        expectedAnswer: word.split('').join('-'), // S-C-H-O-O-L
        langForQuestion: 'fa-IR',
        langForAnswer: 'en-US',
        type: 'spelling'
      });
    }
    
    // 4. سوالات جمله (مکالمه)
    if (item.type === 'sentence') {
      allQuestions.push({
        id: 'sentence_en_' + word,
        questionText: `معنی این جمله چیست؟ "${word}"`,
        expectedAnswer: meaning,
        langForQuestion: 'en-US',
        langForAnswer: 'fa-IR',
        type: 'sentence'
      });
      
      allQuestions.push({
        id: 'sentence_fa_' + word,
        questionText: `این جمله را به انگلیسی بگو: "${meaning}"`,
        expectedAnswer: word,
        langForQuestion: 'fa-IR',
        langForAnswer: 'en-US',
        type: 'sentence'
      });
    }
  });
}

// ---------- الگوریتم عدم تکرار ----------
let bag = [];
let history = JSON.parse(localStorage.getItem('exam_history_v5') || '[]');
let stats = { correct: 0, wrong: 0, score: 0 };
let examActive = false;

function initExamBag() {
  let remaining = allQuestions.filter(q => !history.includes(q.id));
  
  if (remaining.length === 0) {
    history = [];
    localStorage.setItem('exam_history_v5', JSON.stringify(history));
    remaining = [...allQuestions];
    toast('همه سوالات پرسیده شدند. ترم جدید آغاز شد!');
  }
  
  bag = shuffle([...remaining]);
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ---------- وضعیت ----------
let current = null;
let answered = false;
let isSpeaking = false;
let isListening = false;
let micPermissionGranted = false;
let recognition = null;
let autoMode = false;

// ---------- تشخیص گفتار ----------
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    isListening = true;
    setMicIcon('🎙️', 'listening');
    setStatus('گوش می‌دهم... جوابت را بگو', '');
  };
  recognition.onend = () => {
    isListening = false;
    setMicIcon('🔊', '');
    if (examActive && autoMode && !answered && current) {
      setTimeout(() => { if (examActive && autoMode && !answered && current) safeStartListening(); }, 300);
    }
  };
  recognition.onerror = (e) => {
    isListening = false;
    setMicIcon('🔊', '');
    if (e.error === 'no-speech') {
      if (examActive && autoMode && !answered && current) setTimeout(() => safeStartListening(), 500);
      return;
    }
    if (e.error === 'not-allowed') {
      setStatus('❌ دسترسی میکروفن داده نشد', 'bad');
      return;
    }
    if (examActive && autoMode && !answered && current) setTimeout(() => safeStartListening(), 800);
  };
  recognition.onresult = (event) => {
    for (let i = event.resultIndex; i < event.results.length; i++) {
      if (event.results[i].isFinal) {
        const transcript = event.results[i][0].transcript.trim();
        if (transcript.length > 0 && !answered) handleAnswer(transcript);
      }
    }
  };
}

function safeStartListening() {
  if (!recognition || isListening || isSpeaking || answered || !current) return;
  try {
    recognition.lang = current.langForAnswer; // زبان جواب متفاوت است
    recognition.start();
  } catch(e) {}
}

// ---------- شروع آزمون ----------
async function requestPermissionsAndStart() {
  const splash = document.getElementById('splash');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    micPermissionGranted = true;
    stream.getTracks().forEach(t => t.stop());
  } catch (err) {
    alert('❌ دسترسی میکروفن داده نشد!');
    return;
  }
  splash.classList.add('hidden');
  examActive = true;
  buildQuestionBank(); // تولید سوالات
  initExamBag();
  startAuto();
}

function startAuto() {
  autoMode = true;
  document.getElementById('startBtn').textContent = '⏸️ توقف';
  document.getElementById('startBtn').classList.remove('main');
  document.getElementById('startBtn').classList.add('danger');
  nextQuestion();
}

function toggleAuto() {
  if (!micPermissionGranted) { requestPermissionsAndStart(); return; }
  if (autoMode) {
    autoMode = false;
    document.getElementById('startBtn').textContent = '▶️ شروع';
    document.getElementById('startBtn').classList.add('main');
    document.getElementById('startBtn').classList.remove('danger');
    if (recognition && isListening) try { recognition.stop(); } catch(e){}
    speechSynthesis.cancel();
    setStatus('متوقف شد', '');
  } else {
    startAuto();
  }
}

// ---------- سوال بعدی ----------
function nextQuestion() {
  if (!examActive || !autoMode) return;
  answered = false;
  
  if (bag.length === 0) {
    initExamBag();
    if (bag.length === 0) { finishExam(); return; }
  }
  
  current = bag.pop();
  if (!current) return;
  
  if (!history.includes(current.id)) {
    history.push(current.id);
    localStorage.setItem('exam_history_v5', JSON.stringify(history));
  }

  const qt = document.getElementById('questionText');
  const ql = document.getElementById('qLabel');
  
  qt.textContent = current.questionText;
  ql.textContent = 'به سوال گوش کن و جواب بده:';
  
  updateProgress();
  setStatus('...', '');

  // خواندن سوال با زبان مناسب
  speakQuestionThenListen();
}

function speakQuestionThenListen() {
  isSpeaking = true;
  setMicIcon('🔊', 'speaking');
  setStatus('🎧 گوش کن...', '');
  
  speakText(current.questionText, current.langForQuestion, () => {
    isSpeaking = false;
    setMicIcon('🔊', '');
    if (examActive && autoMode && !answered && current) {
      setTimeout(() => safeStartListening(), 400);
    }
  });
}

function speakText(text, lang, onEnd) {
  if (!('speechSynthesis' in window)) { if(onEnd) onEnd(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  u.rate = 0.9; // کمی کندتر برای درک بهتر
  u.onend = () => { if (onEnd) onEnd(); };
  u.onerror = () => { if (onEnd) onEnd(); };
  speechSynthesis.speak(u);
}

// ---------- بررسی پاسخ ----------
function handleAnswer(transcript) {
  if (!current || answered) return;
  answered = true;
  if (recognition) try { recognition.stop(); } catch(e){}
  
  const expected = current.expectedAnswer;
  
  // برای سوالات اسپل، حروف جدا شده را با هم مقایسه می‌کنیم
  let isCorrect = false;
  if (current.type === 'spelling') {
    // حذف خط تیره و فاصله و مقایسه
    const cleanTranscript = transcript.replace(/[-\s]/g, '').toLowerCase();
    const cleanExpected = expected.replace(/[-\s]/g, '').toLowerCase();
    isCorrect = isClose(cleanTranscript, cleanExpected) || isClose(transcript, expected);
  } else {
    isCorrect = isClose(transcript, expected);
  }

  if (isCorrect) {
    stats.correct++; stats.score += 10;
    setStatus('✅ درست! (' + transcript + ')', 'ok');
    setMicIcon('🎉', '');
    speakFeedback(true, () => { if (examActive && autoMode) setTimeout(() => nextQuestion(), 500); });
  } else {
    stats.wrong++; stats.score = Math.max(0, stats.score - 5);
    setStatus('❌ نادرست. تو گفتی: "' + transcript + '" — درست: "' + expected + '"', 'bad');
    setMicIcon('😢', '');
    speakFeedback(false, () => { if (examActive && autoMode) setTimeout(() => nextQuestion(), 800); });
  }
  updateStats();
}

function normalize(s) {
  return String(s).toLowerCase()
    .replace(/[\u064B-\u0652]/g, '')
    .replace(/[.,!?؟؛:'"“”]/g, '')
    .replace(/\s+/g, ' ')
    .replace(/ي/g, 'ی').replace(/ك/g, 'ک')
    .replace(/[آأإ]/g, 'ا')
    .trim();
}

function isClose(a, b) {
  const A = normalize(a), B = normalize(b);
  if (!A || !B) return false;
  if (A === B) return true;
  if (A.includes(B) || B.includes(A)) return true;
  const parts = B.split(' ');
  if (parts.length > 1 && parts.every(p => A.includes(p))) return true;
  const dist = levenshtein(A, B);
  const maxLen = Math.max(A.length, B.length);
  return maxLen > 0 && (dist / maxLen) < 0.4; // تحمل خطای ۴۰ درصد برای لهجه
}

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (m === 0) return n; if (n === 0) return m;
  const dp = Array.from({length: m+1}, () => Array(n+1).fill(0));
  for (let i=0;i<=m;i++) dp[i][0]=i;
  for (let j=0;j<=n;j++) dp[0][j]=j;
  for (let i=1;i<=m;i++) for (let j=1;j<=n;j++)
    dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return dp[m][n];
}

function speakFeedback(ok, onEnd) {
  const text = ok ? 'Correct! Well done' : 'Wrong. Try again';
  speakText(text, 'en-US', onEnd);
}

// ---------- پایان آزمون ----------
function finishExam() {
  examActive = false;
  autoMode = false;
  if (recognition && isListening) try { recognition.stop(); } catch(e){}
  speechSynthesis.cancel();
  
  document.getElementById('quizContainer').style.display = 'none';
  document.getElementById('resultContainer').style.display = 'block';
  
  const total = stats.correct + stats.wrong;
  const finalScore = total > 0 ? Math.round((stats.correct / total) * 20) : 0;
  
  document.getElementById('finalScore').textContent = finalScore + ' / 20';
  document.getElementById('resCorrect').textContent = stats.correct;
  document.getElementById('resWrong').textContent = stats.wrong;
}

function forceNext() {
  if (recognition && isListening) try { recognition.stop(); } catch(e){}
  speechSynthesis.cancel();
  answered = false;
  nextQuestion();
}

function updateStats() {
  document.getElementById('statCorrect').textContent = stats.correct;
  document.getElementById('statWrong').textContent = stats.wrong;
  document.getElementById('statScore').textContent = stats.score;
}

function updateProgress() {
  const total = allQuestions.length;
  const done = history.length;
  const pct = Math.min(100, Math.round((done / total) * 100));
  document.getElementById('progBar').style.width = pct + '%';
}

let toastTimer;
function toast(msg, err) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (err?' err':'');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.className='toast', 2000);
}

function setStatus(msg, cls) {
  const s = document.getElementById('status'); s.textContent = msg;
  s.className = 'status ' + (cls || '');
}

function setMicIcon(icon, cls) {
  const el = document.getElementById('micIcon'); el.textContent = icon;
  el.className = 'mic-status ' + (cls || '');
}

// ---------- شروع اولیه ----------
buildQuestionBank();
updateStats();
