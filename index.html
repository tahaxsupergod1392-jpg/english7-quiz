<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>آزمون جامع پایان ترم زبان هفتم</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: Tahoma, sans-serif;
    background: linear-gradient(160deg, #0f172a, #1e293b);
    color: #eee; min-height: 100vh; display: flex; flex-direction: column;
  }
  header {
    background: #1e3a8a; padding: 14px; text-align: center;
    box-shadow: 0 2px 10px #0008;
  }
  header h1 { margin: 0; font-size: 17px; color: #fbbf24; }
  header p { margin: 4px 0 0; font-size: 11px; color: #cbd5e1; }

  .container { padding: 16px; max-width: 500px; margin: auto; flex: 1; display: flex; flex-direction: column; justify-content: center; }

  /* صفحه خوش‌آمد */
  #splash {
    position: fixed; inset: 0; background: linear-gradient(160deg, #0f172a, #1e3a8a);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 999; padding: 24px; text-align: center;
  }
  #splash.hidden { display: none; }
  #splash h2 { color: #fbbf24; font-size: 22px; margin-bottom: 8px; }
  #splash p { font-size: 13px; color: #cbd5e1; line-height: 1.9; margin-bottom: 24px; }
  #splash .big-icon { font-size: 72px; margin-bottom: 16px; }
  #splash button {
    background: linear-gradient(145deg, #22c55e, #15803d);
    color: #fff; border: none; padding: 18px 32px; border-radius: 16px;
    font-family: inherit; font-size: 17px; font-weight: bold; cursor: pointer;
    box-shadow: 0 8px 24px #22c55e66; transition: .2s; width: 100%; max-width: 320px;
  }
  #splash button:active { transform: scale(.97); }

  .card {
    background: #1e293b; border-radius: 20px; padding: 24px;
    margin-bottom: 16px; box-shadow: 0 4px 15px #0006; text-align: center;
  }

  .question-box {
    padding: 30px 10px; background: #0f172a;
    border-radius: 16px; margin-bottom: 20px; border: 1px dashed #475569;
  }
  .question-label { font-size: 12px; color: #94a3b8; margin-bottom: 10px; }
  .question-text { font-size: 22px; font-weight: bold; color: #60a5fa; min-height: 60px; line-height: 1.6; }
  .question-text.fa { color: #f472b6; direction: rtl; }

  .mic-status {
    font-size: 48px; margin: 10px 0; height: 60px;
    display: flex; align-items: center; justify-content: center;
  }
  .mic-status.listening { animation: pulse 1.2s infinite; color: #22c55e; }
  .mic-status.speaking { color: #fbbf24; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }

  .status { font-size: 14px; margin: 8px 0; min-height: 24px; color: #cbd5e1; }
  .status.ok { color: #4ade80; font-weight: bold; font-size: 16px; }
  .status.bad { color: #f87171; font-weight: bold; font-size: 16px; }

  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row > * { flex: 1; }

  button {
    background: #334155; color: #fff; border: none; padding: 14px;
    border-radius: 12px; font-family: inherit; font-size: 14px; cursor: pointer;
    transition: .2s;
  }
  button:active { transform: scale(.97); }
  button.main { background: #1d4ed8; font-weight: bold; }
  button.danger { background: #b91c1c; }

  .stats { display: flex; justify-content: space-around; text-align: center; font-size: 11px; color:#94a3b8; margin-top: 16px;}
  .stats b { display: block; font-size: 22px; color: #fbbf24; }

  .hint { font-size: 11px; color: #64748b; margin-top: 10px; line-height: 1.7; text-align: right; }
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: #16a34a; color: #fff; padding: 10px 20px; border-radius: 20px;
    font-size: 13px; z-index: 100; opacity: 0; transition: .3s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .toast.err { background: #dc2626; }
  .progress { height: 6px; background: #0f172a; border-radius: 3px; overflow: hidden; margin: 10px 0; }
  .progress > div { height: 100%; background: linear-gradient(90deg, #fbbf24, #f472b6); width: 0%; transition: .3s; }

  .result-screen { display: none; text-align: center; padding: 20px 0; }
  .result-screen h2 { color: #fbbf24; font-size: 24px; }
  .result-score { font-size: 48px; font-weight: bold; color: #4ade80; margin: 20px 0; }
  .result-details { display: flex; justify-content: space-around; margin: 20px 0; font-size: 16px; }
  .result-details div { background: #0f172a; padding: 10px 20px; border-radius: 10px; }
</style>
</head>
<body>

<div id="splash">
  <div class="big-icon">📝</div>
  <h2>آزمون پایان ترم زبان هفتم</h2>
  <p>کل کتاب (دانش‌آموز + کار) — لغت، گرامر، مکالمه</p>
  <button onclick="requestPermissionsAndStart()">✅ شروع آزمون</button>
  <p class="hint" style="color:#94a3b8; margin-top: 16px;">
    پس از زدن دکمه، به میکروفن اجازه (Allow) بدهید.
  </p>
</div>

<header>
  <h1>📝 آزمون پایان ترم هفتم</h1>
  <p>هیچ سوالی تکرار نمی‌شود!</p>
</header>

<div class="container">
  <div id="quizContainer">
    <div class="card">
      <div class="progress"><div id="progBar"></div></div>

      <div class="question-box">
        <div class="question-label" id="qLabel">آماده‌ام...</div>
        <div class="question-text" id="questionText">...</div>
      </div>

      <div class="mic-status" id="micIcon">🔊</div>
      <div class="status" id="status">در حال آماده‌سازی...</div>

      <div class="row">
        <button class="main" id="startBtn" onclick="toggleAuto()">▶️ شروع آزمون</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button onclick="forceNext()">⏭️ رد کردن</button>
        <button class="danger" onclick="finishExam()">🏁 پایان و دیدن نتیجه</button>
      </div>

      <div class="stats">
        <div>درست <b id="statCorrect">0</b></div>
        <div>غلط <b id="statWrong">0</b></div>
        <div>امتیاز <b id="statScore">0</b></div>
      </div>
    </div>
  </div>

  <div id="resultContainer" class="card result-screen">
    <h2>🏆 نتیجه نهایی آزمون</h2>
    <div class="result-score" id="finalScore">20</div>
    <div class="result-details">
      <div>درست: <b id="resCorrect">0</b></div>
      <div>غلط: <b id="resWrong">0</b></div>
    </div>
    <button class="main" onclick="location.reload()" style="margin-top:20px">🔄 آزمون مجدد</button>
  </div>
</div>

<div class="toast" id="toast"></div>

  {en:"Come here", fa:"بیا اینجا", type:"conversation"},
  {en:"Go there", fa:"برو آنجا", type:"conversation"},
  {en:"Stand up", fa:"بایست", type:"conversation"},
  {en:"Sit down", fa:"بنشین", type:"conversation"},
  {en:"Open the door", fa:"در را باز کن", type:"conversation"},
  {en:"Close the window", fa:"پنجره را ببند", type:"conversation"},
  {en:"Listen to me", fa:"به من گوش کن", type:"conversation"},
  {en:"Look at the picture", fa:"به تصویر نگاه کن", type:"conversation"},
  {en:"Write your name", fa:"اسمت را بنویس", type:"conversation"},
  {en:"Read the text", fa:"متن را بخوان", type:"conversation"},
  {en:"Monday", fa:"دوشنبه", type:"vocab"},
  {en:"Tuesday", fa:"سه‌شنبه", type:"vocab"},
  {en:"Wednesday", fa:"چهارشنبه", type:"vocab"},
  {en:"Thursday", fa:"پنجشنبه", type:"vocab"},
  {en:"Friday", fa:"جمعه", type:"vocab"},
  {en:"Saturday", fa:"شنبه", type:"vocab"},
  {en:"Sunday", fa:"یکشنبه", type:"vocab"},
  {en:"one", fa:"یک", type:"vocab"},
  {en:"two", fa:"دو", type:"vocab"},
  {en:"three", fa:"سه", type:"vocab"},
  {en:"four", fa:"چهار", type:"vocab"},
  {en:"five", fa:"پنج", type:"vocab"},
  {en:"six", fa:"شش", type:"vocab"},
  {en:"seven", fa:"هفت", type:"vocab"},
  {en:"eight", fa:"هشت", type:"vocab"},
  {en:"nine", fa:"نه", type:"vocab"},
  {en:"ten", fa:"ده", type:"vocab"}
];

// ---------- الگوریتم عدم تکرار کامل ----------
let bag = [];
let history = JSON.parse(localStorage.getItem('exam_history_v3') || '[]');
let stats = { correct: 0, wrong: 0, score: 0 };
let examActive = false;

function initExamBag() {
  let remaining = ALL_QUESTIONS.filter(q => !history.includes(q.en));
  
  if (remaining.length === 0) {
    history = [];
    localStorage.setItem('exam_history_v3', JSON.stringify(history));
    remaining = [...ALL_QUESTIONS];
    toast('همه سوالات پرسیده شدند. ترم جدید آغاز شد!');
  }
  
  bag = shuffle([...remaining]);
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ---------- وضعیت ----------
let current = null;
let mode = 'en'; 
let answered = false;
let isSpeaking = false;
let isListening = false;
let micPermissionGranted = false;
let recognition = null;
let autoMode = false;

// ---------- تشخیص گفتار ----------
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    isListening = true;
    setMicIcon('🎙️', 'listening');
    setStatus('گوش می‌دهم... جوابت را بگو', '');
  };
  recognition.onend = () => {
    isListening = false;
    setMicIcon('🔊', '');
    if (examActive && autoMode && !answered && current) {
      setTimeout(() => { if (examActive && autoMode && !answered && current) safeStartListening(); }, 300);
    }
  };
  recognition.onerror = (e) => {
    isListening = false;
    setMicIcon('🔊', '');
    if (e.error === 'no-speech') {
      if (examActive && autoMode && !answered && current) setTimeout(() => safeStartListening(), 500);
      return;
    }
    if (e.error === 'not-allowed') {
      setStatus('❌ دسترسی میکروفن داده نشد', 'bad');
      return;
    }
    if (examActive && autoMode && !answered && current) setTimeout(() => safeStartListening(), 800);
  };
  recognition.onresult = (event) => {
    for (let i = event.resultIndex; i < event.results.length; i++) {
      if (event.results[i].isFinal) {
        const transcript = event.results[i][0].transcript.trim();
        if (transcript.length > 0 && !answered) handleAnswer(transcript);
      }
    }
  };
}

function safeStartListening() {
  if (!recognition || isListening || isSpeaking || answered) return;
  try {
    recognition.lang = (mode === 'en') ? 'fa-IR' : 'en-US';
    recognition.start();
  } catch(e) {}
}

// ---------- شروع آزمون ----------
async function requestPermissionsAndStart() {
  const splash = document.getElementById('splash');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    micPermissionGranted = true;
    stream.getTracks().forEach(t => t.stop());
  } catch (err) {
    alert('❌ دسترسی میکروفن داده نشد!');
    return;
  }
  splash.classList.add('hidden');
  examActive = true;
  initExamBag();
  startAuto();
}

function startAuto() {
  autoMode = true;
  document.getElementById('startBtn').textContent = '⏸️ توقف آزمون';
  document.getElementById('startBtn').classList.remove('main');
  document.getElementById('startBtn').classList.add('danger');
  nextQuestion(true);
}

function toggleAuto() {
  if (!micPermissionGranted) { requestPermissionsAndStart(); return; }
  if (autoMode) {
    autoMode = false;
    document.getElementById('startBtn').textContent = '▶️ شروع آزمون';
    document.getElementById('startBtn').classList.add('main');
    document.getElementById('startBtn').classList.remove('danger');
    if (recognition && isListening) try { recognition.stop(); } catch(e){}
    speechSynthesis.cancel();
    setStatus('آزمون متوقف شد', '');
  } else {
    startAuto();
  }
}

// ---------- سوال بعدی ----------
function nextQuestion(speak) {
  if (!examActive || !autoMode) return;
  answered = false;
  
  if (bag.length === 0) {
    initExamBag();
    if (bag.length === 0) { finishExam(); return; }
  }
  
  current = bag.pop();
  if (!current) return;
  
  if (!history.includes(current.en)) {
    history.push(current.en);
    localStorage.setItem('exam_history_v3', JSON.stringify(history));
  }

  // تصادفی کردن نوع سوال
  mode = Math.random() < 0.5 ? 'en' : 'fa';
  
  const qt = document.getElementById('questionText');
  const ql = document.getElementById('qLabel');
  
  if (mode === 'en') {
    qt.textContent = current.en;
    qt.classList.remove('fa');
    ql.textContent = 'این را به فارسی بگو:';
  } else {
    qt.textContent = current.fa;
    qt.classList.add('fa');
    ql.textContent = 'این را به انگلیسی بگو:';
  }
  
  updateProgress();
  setStatus('...', '');

  if (speak) speakQuestionThenListen();
  else safeStartListening();
}

function speakQuestionThenListen() {
  isSpeaking = true;
  setMicIcon('🔊', 'speaking');
  setStatus('🎧 گوش کن...', '');
  
  const text = (mode === 'en') ? current.en : current.fa;
  const lang = (mode === 'en') ? 'en-US' : 'fa-IR';
  
  speakText(text, lang, () => {
    isSpeaking = false;
    setMicIcon('🔊', '');
    if (examActive && autoMode && !answered && current) {
      setTimeout(() => safeStartListening(), 400);
    }
  });
}

function speakText(text, lang, onEnd) {
  if (!('speechSynthesis' in window)) { if(onEnd) onEnd(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  u.rate = 0.95;
  u.onend = () => { if (onEnd) onEnd(); };
  u.onerror = () => { if (onEnd) onEnd(); };
  speechSynthesis.speak(u);
}

// ---------- بررسی پاسخ ----------
function handleAnswer(transcript) {
  if (!current || answered) return;
  answered = true;
  if (recognition) try { recognition.stop(); } catch(e){}
  
  const expected = (mode === 'en') ? current.fa : current.en;
  const ok = isClose(transcript, expected);

  if (ok) {
    stats.correct++; stats.score += 10;
    setStatus('✅ درست! (' + transcript + ')', 'ok');
    setMicIcon('🎉', '');
    speakFeedback(true, () => { if (examActive && autoMode) setTimeout(() => nextQuestion(true), 500); });
  } else {
    stats.wrong++; stats.score = Math.max(0, stats.score - 5);
    setStatus('❌ نادرست. تو گفتی: "' + transcript + '" — درست: "' + expected + '"', 'bad');
    setMicIcon('😢', '');
    speakFeedback(false, () => { if (examActive && autoMode) setTimeout(() => nextQuestion(true), 800); });
  }
  updateStats();
}

function normalize(s) {
  return String(s).toLowerCase()
    .replace(/[\u064B-\u0652]/g, '')
    .replace(/[.,!?؟؛:'"“”]/g, '')
    .replace(/\s+/g, ' ')
    .replace(/ي/g, 'ی').replace(/ك/g, 'ک')
    .replace(/[آأإ]/g, 'ا')
    .trim();
}

function isClose(a, b) {
  const A = normalize(a), B = normalize(b);
  if (!A || !B) return false;
  if (A === B) return true;
  if (A.includes(B) || B.includes(A)) return true;
  const parts = B.split(' ');
  if (parts.length > 1 && parts.every(p => A.includes(p))) return true;
  const dist = levenshtein(A, B);
  const maxLen = Math.max(A.length, B.length);
  return maxLen > 0 && (dist / maxLen) < 0.4;
}

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (m === 0) return n; if (n === 0) return m;
  const dp = Array.from({length: m+1}, () => Array(n+1).fill(0));
  for (let i=0;i<=m;i++) dp[i][0]=i;
  for (let j=0;j<=n;j++) dp[0][j]=j;
  for (let i=1;i<=m;i++) for (let j=1;j<=n;j++)
    dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return dp[m][n];
}

function speakFeedback(ok, onEnd) {
  const text = ok ? 'Correct! Well done' : 'Wrong. Try again';
  speakText(text, 'en-US', onEnd);
}

// ---------- پایان آزمون ----------
function finishExam() {
  examActive = false;
  autoMode = false;
  if (recognition && isListening) try { recognition.stop(); } catch(e){}
  speechSynthesis.cancel();
  
  document.getElementById('quizContainer').style.display = 'none';
  document.getElementById('resultContainer').style.display = 'block';
  
  const total = stats.correct + stats.wrong;
  const finalScore = total > 0 ? Math.round((stats.correct / total) * 20) : 0;
  
  document.getElementById('finalScore').textContent = finalScore + ' / 20';
  document.getElementById('resCorrect').textContent = stats.correct;
  document.getElementById('resWrong').textContent = stats.wrong;
}

function forceNext() {
  if (recognition && isListening) try { recognition.stop(); } catch(e){}
  speechSynthesis.cancel();
  answered = false;
  nextQuestion(true);
}

function updateStats() {
  document.getElementById('statCorrect').textContent = stats.correct;
  document.getElementById('statWrong').textContent = stats.wrong;
  document.getElementById('statScore').textContent = stats.score;
}

function updateProgress() {
  const total = ALL_QUESTIONS.length;
  const done = history.length;
  const pct = Math.min(100, Math.round((done / total) * 100));
  document.getElementById('progBar').style.width = pct + '%';
}

let toastTimer;
function toast(msg, err) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (err?' err':'');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.className='toast', 2000);
}

function setStatus(msg, cls) {
  const s = document.getElementById('status'); s.textContent = msg;
  s.className = 'status ' + (cls || '');
}

function setMicIcon(icon, cls) {
  const el = document.getElementById('micIcon'); el.textContent = icon;
  el.className = 'mic-status ' + (cls || '');
}

// ---------- شروع اولیه ----------
updateStats();
if (history.length === 0) initExamBag();
</script>
